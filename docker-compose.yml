services:
  postgres:
    image: postgres:16-alpine
    container_name: gerentregas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gerentregas
      POSTGRES_PASSWORD: gerentregas
      POSTGRES_DB: gerentregas
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: